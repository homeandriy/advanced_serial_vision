[project]
name = "serial-vision"
dynamic = ["version"]
description = "Desktop application for recognizing and recording equipment serial numbers."
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.8,<7",
    "Pillow>=10.0",
    "keyring>=25,<27",
    "rapidocr>=3.4,<4",
    "onnxruntime>=1.20,<2",
    "zxing-cpp>=2.3,<3",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.11,<7"]

[project.scripts]
serial-vision = "serial_vision.main:main"

[tool.setuptools]
package-dir = {"" = "application"}

[tool.setuptools.packages.find]
where = ["application"]

[tool.setuptools.dynamic]
version = {file = ["VERSION"]}

[tool.setuptools.package-data]
serial_vision = ["assets/*.qss", "assets/*.png", "assets/*.ico"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["application/tests"]
